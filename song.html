<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Loading…</title>
  <link rel="icon" href="assets/favicon.png" type="image/png" />
  <link rel="preload" href="fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="style.6e85a90c.css" />
  <style>html, body { overflow: hidden; height: 100dvh; }</style>
  <script>
    (() => {
      const songTransitionStorageKey = 'selected-song-transition';
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const rawPreview = sessionStorage.getItem('selected-song');
      const rawTransition = sessionStorage.getItem(songTransitionStorageKey);

      if (rawTransition && !prefersReducedMotion) {
        try {
          const transition = JSON.parse(rawTransition);
          const isFresh = transition && typeof transition.createdAt === 'number' && (Date.now() - transition.createdAt) < 4000;
          if (isFresh && transition.id === id) {
            window.__songTransition = transition;
            document.documentElement.classList.add('song-transition-pending');
          } else {
            sessionStorage.removeItem(songTransitionStorageKey);
          }
        } catch (error) {
          console.warn('Ignoring invalid song transition cache.', error);
          sessionStorage.removeItem(songTransitionStorageKey);
        }
      }

      if (!rawPreview) {
        return;
      }

      try {
        const preview = JSON.parse(rawPreview);
        if (!preview || preview.id !== id) {
          return;
        }

        window.__songPreview = preview;

        if (preview.art) {
          const preload = document.createElement('link');
          preload.rel = 'preload';
          preload.as = 'image';
          preload.href = preview.artSources?.preload || preview.art;
          document.head.appendChild(preload);
        }
      } catch (error) {
        console.warn('Ignoring invalid song preview cache.', error);
        sessionStorage.removeItem('selected-song');
      }
    })();
  </script>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
      All releases
    </a>
    <a href="index.html" class="nav-logo" id="nav-logo"></a>
  </nav>

  <main class="song-page" id="song-page">
    <!-- Background blur layer -->
    <div class="song-bg-blur" id="bg-blur"></div>

    <div class="song-content is-loading" id="song-content">
      <div class="song-album-art fade-up fade-up-1" id="album-art">
        <div class="song-art-skeleton ghost-shimmer" aria-hidden="true"></div>
      </div>

      <h1 class="song-title fade-up fade-up-2" id="song-title">
        <span class="song-line-skeleton ghost-shimmer" aria-hidden="true"></span>
      </h1>
      <p class="song-subtitle fade-up fade-up-3" id="song-subtitle">
        <span class="song-subtitle-skeleton ghost-shimmer" aria-hidden="true"></span>
      </p>

      <div class="stream-buttons fade-up fade-up-4" id="stream-buttons">
        <div class="stream-btn stream-btn-skeleton ghost-shimmer" aria-hidden="true"></div>
        <div class="stream-btn stream-btn-skeleton ghost-shimmer" aria-hidden="true"></div>
        <div class="stream-btn stream-btn-skeleton ghost-shimmer" aria-hidden="true"></div>
      </div>
    </div>
  </main>

  <script>
    (() => {
      const preview = window.__songPreview;
      if (!preview) {
        return;
      }

      function buildPreviewPictureHTML(artSources, alt, sizes, options = {}) {
        if (!artSources) {
          return `<div class="placeholder-art">🎵</div>`;
        }

        const {
          loading = '',
          decoding = 'async',
          fetchPriority = '',
          onerror = '',
          ariaHidden = false,
        } = options;

        const loadingAttr = loading ? ` loading="${loading}"` : '';
        const decodingAttr = decoding ? ` decoding="${decoding}"` : '';
        const fetchPriorityAttr = fetchPriority ? ` fetchpriority="${fetchPriority}"` : '';
        const onerrorAttr = onerror ? ` onerror="${onerror}"` : '';
        const ariaHiddenAttr = ariaHidden ? ` aria-hidden="true"` : '';

        return `
          <img src="${artSources.src}" srcset="${artSources.srcSet}" sizes="${sizes}" alt="${alt}"${loadingAttr}${decodingAttr}${fetchPriorityAttr}${ariaHiddenAttr}${onerrorAttr} />
        `;
      }

      const artEl = document.getElementById('album-art');
      const bgBlur = document.getElementById('bg-blur');
      const titleEl = document.getElementById('song-title');
      const subtitleEl = document.getElementById('song-subtitle');
      const btnsEl = document.getElementById('stream-buttons');

      document.title = `${preview.title} — ${preview.artistName || 'Artist'}`;
      titleEl.textContent = preview.title;
      subtitleEl.textContent = preview.subtitle || '';

      if (preview.art) {
        artEl.innerHTML = buildPreviewPictureHTML(
          preview.artSources,
          preview.title,
          '(max-width: 600px) 75vw, 240px',
          {
            decoding: 'async',
            fetchPriority: 'high',
            onerror: "this.closest('.song-album-art').innerHTML='<div class=\\'placeholder-art\\'>🎵</div>'",
          },
        );
        bgBlur.innerHTML = buildPreviewPictureHTML(
          preview.artSources,
          '',
          '100vw',
          {
            decoding: 'async',
            ariaHidden: true,
          },
        );
      } else {
        artEl.innerHTML = `<div class="placeholder-art">🎵</div>`;
        bgBlur.style.background = `radial-gradient(ellipse at center, ${preview.color || '#7c3aed'}33 0%, transparent 70%)`;
      }

      if (preview.color) {
        artEl.style.boxShadow = `0 30px 80px rgba(0,0,0,0.6), 0 0 60px ${preview.color}33, 0 0 0 1px rgba(255,255,255,0.06)`;
      }

      btnsEl.innerHTML = `
        <div class="stream-btn stream-btn-skeleton ghost-shimmer" aria-hidden="true"></div>
        <div class="stream-btn stream-btn-skeleton ghost-shimmer" aria-hidden="true"></div>
        <div class="stream-btn stream-btn-skeleton ghost-shimmer" aria-hidden="true"></div>
      `;
    })();
  </script>

  <script src="data.868fa05d.js"></script>
  <script>
    const navLogo = document.getElementById('nav-logo');
    const contentEl = document.getElementById('song-content');
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const songTransitionStorageKey = 'selected-song-transition';
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let sharedSongTransitionPlayed = false;

    function clearSharedSongTransition() {
      document.documentElement.classList.remove('song-transition-pending');
      document.body.classList.remove('shared-song-transition');
      sessionStorage.removeItem(songTransitionStorageKey);
      delete window.__songTransition;
    }

    function applyRectStyles(element, rect) {
      element.style.left = `${rect.left}px`;
      element.style.top = `${rect.top}px`;
      element.style.width = `${rect.width}px`;
      if ('height' in rect) {
        element.style.height = `${rect.height}px`;
      }
    }

    function createTextOverlay(className, text, snapshot) {
      if (!snapshot || !snapshot.rect) {
        return null;
      }

      const element = document.createElement('div');
      element.className = className;
      element.textContent = text;
      applyRectStyles(element, snapshot.rect);
      element.style.fontSize = snapshot.fontSize;
      element.style.fontWeight = snapshot.fontWeight;
      element.style.letterSpacing = snapshot.letterSpacing;
      element.style.lineHeight = snapshot.lineHeight;
      element.style.color = snapshot.color;
      element.style.textTransform = snapshot.textTransform;
      return element;
    }

    function animateSharedSongEntrance(song) {
      if (sharedSongTransitionPlayed || prefersReducedMotion) {
        clearSharedSongTransition();
        return;
      }

      const transition = window.__songTransition;
      if (!transition || transition.id !== song.id || !transition.art) {
        clearSharedSongTransition();
        return;
      }

      const artEl = document.getElementById('album-art');
      const titleEl = document.getElementById('song-title');
      const subtitleEl = document.getElementById('song-subtitle');
      const artImg = artEl.querySelector('img');

      if (!artImg) {
        clearSharedSongTransition();
        return;
      }

      sharedSongTransitionPlayed = true;
      document.documentElement.classList.remove('song-transition-pending');
      document.body.classList.add('shared-song-transition');

      const layer = document.createElement('div');
      layer.className = 'shared-transition-layer';

      const artOverlay = document.createElement('img');
      artOverlay.className = 'shared-transition-art';
      artOverlay.src = song.artSources?.src || song.art;
      artOverlay.srcset = song.artSources?.srcSet || '';
      artOverlay.sizes = '(max-width: 600px) 75vw, 240px';
      artOverlay.alt = '';
      applyRectStyles(artOverlay, transition.art);
      artOverlay.style.borderRadius = `${transition.art.borderRadius || 16}px`;
      artOverlay.style.boxShadow = '0 18px 42px rgba(0,0,0,0.3)';
      artOverlay.style.transition = 'left 0.46s cubic-bezier(0.22, 1, 0.36, 1), top 0.46s cubic-bezier(0.22, 1, 0.36, 1), width 0.46s cubic-bezier(0.22, 1, 0.36, 1), height 0.46s cubic-bezier(0.22, 1, 0.36, 1), border-radius 0.46s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.46s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease';
      layer.appendChild(artOverlay);

      const titleOverlay = createTextOverlay('shared-transition-title', song.title, transition.title);
      if (titleOverlay) {
        titleOverlay.style.transition = 'left 0.4s cubic-bezier(0.22, 1, 0.36, 1), top 0.4s cubic-bezier(0.22, 1, 0.36, 1), width 0.4s cubic-bezier(0.22, 1, 0.36, 1), font-size 0.4s cubic-bezier(0.22, 1, 0.36, 1), letter-spacing 0.4s cubic-bezier(0.22, 1, 0.36, 1), line-height 0.4s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.18s ease 0.22s';
        layer.appendChild(titleOverlay);
      }

      const subtitleOverlay = createTextOverlay('shared-transition-subtitle', song.subtitle || '', transition.subtitle);
      if (subtitleOverlay) {
        subtitleOverlay.style.transition = 'left 0.38s cubic-bezier(0.22, 1, 0.36, 1), top 0.38s cubic-bezier(0.22, 1, 0.36, 1), width 0.38s cubic-bezier(0.22, 1, 0.36, 1), font-size 0.38s cubic-bezier(0.22, 1, 0.36, 1), letter-spacing 0.38s cubic-bezier(0.22, 1, 0.36, 1), line-height 0.38s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.18s ease 0.18s';
        layer.appendChild(subtitleOverlay);
      }

      document.body.appendChild(layer);

      requestAnimationFrame(() => {
        const artRect = artEl.getBoundingClientRect();
        const artStyle = window.getComputedStyle(artEl);
        applyRectStyles(artOverlay, artRect);
        artOverlay.style.borderRadius = artStyle.borderRadius;
        artOverlay.style.boxShadow = artStyle.boxShadow;

        const titleRect = titleEl.getBoundingClientRect();
        const titleStyle = window.getComputedStyle(titleEl);
        if (titleOverlay) {
          applyRectStyles(titleOverlay, titleRect);
          titleOverlay.style.fontSize = titleStyle.fontSize;
          titleOverlay.style.letterSpacing = titleStyle.letterSpacing;
          titleOverlay.style.lineHeight = titleStyle.lineHeight;
          titleOverlay.style.opacity = '0';
        }

        const subtitleRect = subtitleEl.getBoundingClientRect();
        const subtitleStyle = window.getComputedStyle(subtitleEl);
        if (subtitleOverlay) {
          applyRectStyles(subtitleOverlay, subtitleRect);
          subtitleOverlay.style.fontSize = subtitleStyle.fontSize;
          subtitleOverlay.style.letterSpacing = subtitleStyle.letterSpacing;
          subtitleOverlay.style.lineHeight = subtitleStyle.lineHeight;
          subtitleOverlay.style.opacity = '0';
        }
      });

      window.setTimeout(() => {
        layer.remove();
        document.body.classList.remove('shared-song-transition');
        clearSharedSongTransition();
      }, 480);
    }

    function renderSong(song, artistName) {
      document.title = `${song.title} — ${artistName}`;

      const artEl = document.getElementById('album-art');
      const bgBlur = document.getElementById('bg-blur');
      const titleEl = document.getElementById('song-title');
      const subtitleEl = document.getElementById('song-subtitle');
      const btns = document.getElementById('stream-buttons');

      if (song.art) {
        artEl.innerHTML = buildResponsivePictureHTML(
          song.artSources,
          song.title,
          '(max-width: 600px) 75vw, 240px',
          {
            decoding: 'async',
            fetchPriority: 'high',
            onerror: "this.closest('.song-album-art').innerHTML='<div class=\\'placeholder-art\\'>🎵</div>'",
          },
        );
        bgBlur.innerHTML = buildResponsivePictureHTML(
          song.artSources,
          '',
          '100vw',
          {
            decoding: 'async',
            ariaHidden: true,
          },
        );
      } else {
        artEl.innerHTML = `<div class="placeholder-art">🎵</div>`;
        bgBlur.innerHTML = '';
        bgBlur.style.background = `radial-gradient(ellipse at center, ${song.color || '#7c3aed'}33 0%, transparent 70%)`;
      }

      if (song.color) {
        artEl.style.boxShadow = `0 30px 80px rgba(0,0,0,0.6), 0 0 60px ${song.color}33, 0 0 0 1px rgba(255,255,255,0.06)`;
      }

      titleEl.textContent = song.title;
      subtitleEl.textContent = song.subtitle || '';
      btns.innerHTML = '';

      const platforms = [
        {
          key: 'spotify',
          label: 'Listen on Spotify',
          cls: 'btn-spotify',
          icon: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.494 17.308a.748.748 0 01-1.029.249c-2.818-1.723-6.365-2.112-10.541-1.157a.748.748 0 01-.332-1.46c4.571-1.044 8.492-.595 11.655 1.339a.748.748 0 01.247 1.029zm1.466-3.26a.936.936 0 01-1.287.308c-3.225-1.982-8.141-2.556-11.956-1.399a.936.936 0 11-.543-1.791c4.358-1.323 9.776-.682 13.478 1.595a.936.936 0 01.308 1.287zm.126-3.395C15.53 8.398 9.4 8.192 5.97 9.246a1.123 1.123 0 11-.652-2.149c3.944-1.197 10.501-.965 14.641 1.768a1.123 1.123 0 01-1.374 1.788z"/></svg>`,
        },
        {
          key: 'apple',
          label: 'Listen on Apple Music',
          cls: 'btn-apple',
          icon: `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.41 2.86c.98-.18 1.84.57 1.84 1.57v11.15c0 2.53-1.82 4.31-4.41 4.31-2.33 0-3.99-1.45-3.99-3.51 0-2.09 1.69-3.58 4.13-3.58.58 0 1.12.08 1.58.24V8.59L8.82 9.8v7.22c0 2.53-1.82 4.31-4.4 4.31-2.33 0-3.99-1.45-3.99-3.51 0-2.09 1.69-3.58 4.13-3.58.56 0 1.09.08 1.54.23V6.41c0-.79.56-1.48 1.34-1.61l8.97-1.94z"/></svg>`,
        },
        {
          key: 'youtube',
          label: 'Watch on YouTube',
          cls: 'btn-youtube',
          icon: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.495 6.205a3.007 3.007 0 00-2.088-2.088c-1.87-.501-9.396-.501-9.396-.501s-7.507-.01-9.396.501A3.007 3.007 0 00.527 6.205a31.247 31.247 0 00-.522 5.805 31.247 31.247 0 00.522 5.783 3.007 3.007 0 002.088 2.088c1.868.502 9.396.502 9.396.502s7.506 0 9.396-.502a3.007 3.007 0 002.088-2.088 31.247 31.247 0 00.5-5.783 31.247 31.247 0 00-.5-5.805zM9.609 15.601V8.408l6.264 3.602z"/></svg>`,
        },
      ];

      platforms.forEach(platform => {
        const url = song.links?.[platform.key];
        if (!url) {
          return;
        }

        const link = document.createElement('a');
        link.href = url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.className = `stream-btn ${platform.cls}`;
        link.innerHTML = `${platform.icon}<span>${platform.label}</span>`;
        btns.appendChild(link);
      });

      contentEl.classList.remove('is-loading');
      animateSharedSongEntrance(song);
    }

    navLogo.textContent = artist.name;

    const preview = window.__songPreview;
    if (preview && preview.id === id) {
      renderSong(preview, preview.artistName || artist.name);
    }

    const song = songs.find(s => s.id === id);

    if (!song) {
      clearSharedSongTransition();
      document.title = 'Not Found';
      document.getElementById('song-title').textContent = 'Song not found';
      document.getElementById('song-subtitle').textContent = '';
      document.getElementById('stream-buttons').innerHTML = '';
      contentEl.classList.remove('is-loading');
    } else {
      renderSong(song, artist.name);
    }
  </script>
</body>
</html>
