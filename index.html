  <footer>
    <span id="footer-year"></span> 'X'Lab · All rights reserved
  </footer>

  <script>
    document.getElementById('footer-year').textContent = new Date().getFullYear();
    const scrollStorageKey = 'profile-scroll-y';
    const prefetchedSongs = new Set();
    const songPreviewById = Object.fromEntries([
      {"id":"ella-me-vio","title":"Ella Me Vio","subtitle":"Single · 2025","art":"assets/ella-me-vio.avif","color":"#7c3aed","links":{"spotify":"https://open.spotify.com/album/0wf1GzzxEbJC8o3D2GVREU?si=tSYrvB3dSXqGwxGM7hz-Hw","apple":"https://music.apple.com/us/album/ella-me-vio/1845122459?i=1845122460","youtube":"https://www.youtube.com/watch?v=A04JqK3OkSM"},"artSources":{"src":"assets/ella-me-vio.avif","srcSet":"assets/ella-me-vio-320.avif 320w, assets/ella-me-vio.avif 640w","preload":"assets/ella-me-vio.avif"},"artistName":"Sustancia 'X'"},
      {"id":"artificial","title":"Artificial","subtitle":"Single · 2024","art":"assets/artificial.avif","color":"#7c3aed","links":{"spotify":"https://open.spotify.com/album/5mQTyAXW9pDZBIGRLWcLan?si=FAoXCO87Rfu5X1jrf9clQA","apple":"https://music.apple.com/us/album/artificial-single/1770760767?i=1722199974","youtube":"https://www.youtube.com/watch?v=Caz3HBqcpEY"},"artSources":{"src":"assets/artificial.avif","srcSet":"assets/artificial-320.avif 320w, assets/artificial.avif 640w","preload":"assets/artificial.avif"},"artistName":"Sustancia 'X'"},
      {"id":"weekencito","title":"Weekencito","subtitle":"Single · 2024","art":"assets/weekencito.avif","color":"#a84545","links":{"spotify":"https://open.spotify.com/album/0fqGL7aWCZjeB5vR5meDV6?si=XLEScrsjQtiLJ_q1qUwQ4Q","apple":"https://music.apple.com/us/album/weekencito/1750909020?i=1750909021","youtube":"https://www.youtube.com/watch?v=T9IKjVskkfo"},"artSources":{"src":"assets/weekencito.avif","srcSet":"assets/weekencito-320.avif 320w, assets/weekencito.avif 640w","preload":"assets/weekencito.avif"},"artistName":"Sustancia 'X'"},
      {"id":"una-vez-mas","title":"Una Vez Más","subtitle":"Single · 2023","art":"assets/una-vez-mas.avif","color":"#becfd3","links":{"spotify":"https://open.spotify.com/album/5F3rXzONU01fNqSVFydwui?si=idaEC31yTMari5OOzZGrjw","apple":"https://music.apple.com/us/album/una-vez-m%C3%A1s/1722199973?i=1722199974","youtube":"https://www.youtube.com/watch?v=eD4sAIgguXE"},"artSources":{"src":"assets/una-vez-mas.avif","srcSet":"assets/una-vez-mas-320.avif 320w, assets/una-vez-mas.avif 640w","preload":"assets/una-vez-mas.avif"},"artistName":"Sustancia 'X'"},
      {"id":"no-quiere","title":"No Quiere","subtitle":"Single · 2023","art":"assets/no-quiere.avif","color":"#0891b2","links":{"spotify":"https://open.spotify.com/album/6QLJy2RXJ8JX461wgzhGlL?si=B_P0KfJHRjC4J6O-mmiuJw","apple":"https://music.apple.com/us/album/no-quiere/1711391044?i=1711391046","youtube":"https://www.youtube.com/watch?v=LNy9tKKXeVk"},"artSources":{"src":"assets/no-quiere.avif","srcSet":"assets/no-quiere-320.avif 320w, assets/no-quiere.avif 640w","preload":"assets/no-quiere.avif"},"artistName":"Sustancia 'X'"},
      {"id":"llegar","title":"Llegar","subtitle":"Single · 2023","art":"assets/llegar.avif","color":"#dda867","links":{"spotify":"https://open.spotify.com/album/2XHCUhQFIw1F98azKbdH63?si=YqPRMk-CQsyh-hwBKKRimQ","apple":"https://music.apple.com/us/album/llegar/1698894916?i=1698894917","youtube":"https://www.youtube.com/watch?v=w0wnKhFXh50"},"artSources":{"src":"assets/llegar.avif","srcSet":"assets/llegar-320.avif 320w, assets/llegar.avif 640w","preload":"assets/llegar.avif"},"artistName":"Sustancia 'X'"},
      {"id":"en-mi-mente","title":"En Mi Mente","subtitle":"Single · 2023","art":"assets/en-mi-mente.avif","color":"#dc2626","links":{"spotify":"https://open.spotify.com/album/3rvnfN3MNbUHLXMtfcJ8qO?si=fmjMATjfQL6Xs97lyxsVhw","apple":"https://music.apple.com/us/album/en-mi-mente/1694260538?i=1694260540","youtube":"https://www.youtube.com/watch?v=kPXbzPHYLp0"},"artSources":{"src":"assets/en-mi-mente.avif","srcSet":"assets/en-mi-mente-320.avif 320w, assets/en-mi-mente.avif 640w","preload":"assets/en-mi-mente.avif"},"artistName":"Sustancia 'X'"}
    ].map(song => [song.id, song]));

    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }

    function restoreSavedScroll() {
      const savedScroll = sessionStorage.getItem(scrollStorageKey);
      if (!savedScroll) {
        return;
      }

      const scrollY = Number.parseInt(savedScroll, 10);
      if (Number.isNaN(scrollY)) {
        sessionStorage.removeItem(scrollStorageKey);
        return;
      }

      requestAnimationFrame(() => {
        window.scrollTo(0, scrollY);
        requestAnimationFrame(() => {
          window.scrollTo(0, scrollY);
        });
      });

      sessionStorage.removeItem(scrollStorageKey);
    }

    restoreSavedScroll();
    window.addEventListener('pageshow', () => {
      restoreSavedScroll();
    });

    function prefetchSongPage(songId) {
      const href = `song.html?id=${songId}`;
      if (prefetchedSongs.has(href)) {
        return;
      }

      const link = document.createElement('link');
      link.rel = 'prefetch';
      link.as = 'document';
      link.href = href;
      document.head.appendChild(link);
      prefetchedSongs.add(href);
    }

    function rememberSelectedSong(song) {
      sessionStorage.setItem('selected-song', JSON.stringify(song));
    }

    document.querySelectorAll('.song-card').forEach(card => {
      const songId = card.dataset.songId;
      const song = songPreviewById[songId];
      if (!song) {
        return;
      }

      // Dynamically assign view-transition-name to card's elements for smooth native CSS transition
      const artEl = card.querySelector('.card-art');
      const titleEl = card.querySelector('.card-title');
      const subtitleEl = card.querySelector('.card-subtitle');
      if (artEl) artEl.style.viewTransitionName = `art-${songId}`;
      if (titleEl) titleEl.style.viewTransitionName = `title-${songId}`;
      if (subtitleEl) subtitleEl.style.viewTransitionName = `subtitle-${songId}`;

      const warmSongPage = () => prefetchSongPage(songId);
      card.addEventListener('pointerenter', warmSongPage, { once: true });
      card.addEventListener('focus', warmSongPage, { once: true });
      card.addEventListener('touchstart', warmSongPage, { once: true, passive: true });

      card.addEventListener('click', event => {
        if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
          return;
        }

        sessionStorage.setItem(scrollStorageKey, String(window.scrollY));
        rememberSelectedSong(song);
      });
    });
  </script>
</body>
</html>
