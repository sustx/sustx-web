<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Artist</title>
  <link rel="icon" href="assets/favicon.jpg" type="image/jpeg" />
  <link rel="preload" href="fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="prefetch" href="song.html" as="document" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <section class="hero">
      <div class="artist-profile fade-up fade-up-1">
        <img class="artist-avatar" id="artist-avatar" alt="Artist" />
        <h1 class="hero-title" id="hero-artist-name"></h1>
      </div>
    </section>

    <section class="grid-section">
      <p class="grid-heading fade-up fade-up-2">Discography &nbsp;·&nbsp; All Releases</p>
      <div class="songs-grid" id="songs-grid"></div>
    </section>
  </main>

  <footer>
    <span id="footer-year"></span> 'X'Labs · All rights reserved
  </footer>

  <script src="data.js"></script>
  <script>
    document.getElementById('footer-year').textContent = new Date().getFullYear();
    const scrollStorageKey = 'profile-scroll-y';

    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }

    // Populate artist info from data.js
    document.title = artist.name;
    document.getElementById('hero-artist-name').textContent = artist.name;
    const avatarEl = document.getElementById('artist-avatar');
    if (artist.avatar) {
      avatarEl.src = artist.avatar;
      avatarEl.alt = artist.name;
    } else {
      avatarEl.style.display = 'none';
    }

    const grid = document.getElementById('songs-grid');
    const prefetchedSongs = new Set(['song.html']);

    function resetTransitionState() {
      document.body.classList.remove('page-transitioning');
      document.querySelectorAll('.song-card-activating').forEach(card => {
        card.classList.remove('song-card-activating');
      });
    }

    function restoreSavedScroll() {
      const savedScroll = sessionStorage.getItem(scrollStorageKey);
      if (!savedScroll) {
        return;
      }

      const scrollY = Number.parseInt(savedScroll, 10);
      if (Number.isNaN(scrollY)) {
        sessionStorage.removeItem(scrollStorageKey);
        return;
      }

      requestAnimationFrame(() => {
        window.scrollTo(0, scrollY);
        requestAnimationFrame(() => {
          window.scrollTo(0, scrollY);
        });
      });

      sessionStorage.removeItem(scrollStorageKey);
    }

    resetTransitionState();
    restoreSavedScroll();
    window.addEventListener('pageshow', () => {
      resetTransitionState();
      restoreSavedScroll();
    });
    window.addEventListener('pagehide', resetTransitionState);

    function prefetchSongPage(songId) {
      const href = `song.html?id=${songId}`;
      if (prefetchedSongs.has(href)) {
        return;
      }

      const link = document.createElement('link');
      link.rel = 'prefetch';
      link.as = 'document';
      link.href = href;
      document.head.appendChild(link);
      prefetchedSongs.add(href);
    }

    function rememberSelectedSong(song) {
      sessionStorage.setItem(
        'selected-song',
        JSON.stringify({
          ...song,
          artistName: artist.name,
        }),
      );
    }

    songs.forEach((song, i) => {
      const delay = 0.1 + i * 0.08;
      const artContent = buildResponsivePictureHTML(
        song.artSources,
        song.title,
        '(max-width: 600px) 50vw, (max-width: 900px) 33vw, 220px',
        {
          loading: 'lazy',
          decoding: 'async',
          onerror: "this.closest('.card-art').innerHTML='<div class=\\'placeholder-art\\'>🎵</div>'",
        },
      );

      const card = document.createElement('a');
      card.href = `song.html?id=${song.id}`;
      card.className = 'song-card fade-up';
      card.style.animationDelay = `${delay}s`;
      card.style.setProperty('--glow', song.color || '#7c3aed');
      card.innerHTML = `
        <div class="card-art">
          ${artContent}
        </div>
        <div class="card-info">
          <p class="card-title">${song.title}</p>
          <p class="card-subtitle">${song.subtitle || ''}</p>
        </div>
      `;

      const warmSongPage = () => prefetchSongPage(song.id);
      card.addEventListener('pointerenter', warmSongPage, { once: true });
      card.addEventListener('focus', warmSongPage, { once: true });
      card.addEventListener('touchstart', warmSongPage, { once: true, passive: true });

      card.addEventListener('click', event => {
        if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
          return;
        }

        event.preventDefault();
        sessionStorage.setItem(scrollStorageKey, String(window.scrollY));
        rememberSelectedSong(song);
        prefetchSongPage(song.id);
        card.classList.add('song-card-activating');
        document.body.classList.add('page-transitioning');
        window.setTimeout(() => {
          window.location.href = card.href;
        }, 140);
      });

      grid.appendChild(card);
    });
  </script>
</body>
</html>
