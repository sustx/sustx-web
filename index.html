<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sustancia 'X'</title>
  <link rel="icon" href="assets/favicon.png" type="image/png" />
  <link rel="preload" href="fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="style.6e85a912.css" />
</head>
<body>
  <main>
    <section class="hero">
      <div class="artist-profile fade-up fade-up-1">
        <img class="artist-avatar" id="artist-avatar" src="assets/profile.avif" alt="Sustancia 'X'" width="80" height="80" fetchpriority="high" />
        <h1 class="hero-title" id="hero-artist-name">Sustancia 'X'</h1>
      </div>
    </section>

    <section class="grid-section">
      <p class="grid-heading fade-up fade-up-2">Discography &nbsp;·&nbsp; All Releases</p>
      <div class="songs-grid" id="songs-grid"></div>
    </section>
  </main>

  <footer>
    <span id="footer-year"></span> 'X'Lab · All rights reserved
  </footer>

  <script src="data.aa714b12.js"></script>
  <script>
    document.getElementById('footer-year').textContent = new Date().getFullYear();
    const avatarEl = document.getElementById('artist-avatar');
    const heroArtistNameEl = document.getElementById('hero-artist-name');
    const songsGrid = document.getElementById('songs-grid');
    const scrollStorageKey = 'profile-scroll-y';
    const prefetchedSongs = new Set();

    function getSongHref(songId) {
      return `song.html?id=${encodeURIComponent(songId)}`;
    }

    function getSongCard(songId) {
      const safeSongId = window.CSS && typeof CSS.escape === 'function' ? CSS.escape(songId) : songId;
      return document.querySelector(`.song-card[data-song-id="${safeSongId}"]`);
    }

    function installSpeculationRules(songList) {
      if (!(HTMLScriptElement.supports && HTMLScriptElement.supports('speculationrules'))) {
        return;
      }

      const script = document.createElement('script');
      script.type = 'speculationrules';
      script.textContent = JSON.stringify({
        prerender: [
          {
            source: 'list',
            urls: songList.map(song => getSongHref(song.id)),
          },
        ],
      });
      document.head.appendChild(script);
    }

    function renderSongsGrid(songList) {
      songsGrid.replaceChildren();

      songList.forEach((song, index) => {
        const card = document.createElement('a');
        card.href = getSongHref(song.id);
        card.className = 'song-card fade-up';
        card.style.animationDelay = `${0.1 + index * 0.08}s`;
        card.style.setProperty('--glow', song.color || '#7c3aed');
        card.dataset.songId = song.id;

        const cardArt = document.createElement('div');
        cardArt.className = 'card-art';
        cardArt.innerHTML = buildResponsivePictureHTML(
          song.artSources,
          song.title,
          '(max-width: 600px) 50vw, (max-width: 900px) 33vw, 220px',
          {
            loading: 'eager',
            decoding: 'async',
            fetchPriority: 'high',
            onerror: "this.closest('.card-art').innerHTML='<div class=\\'placeholder-art\\'>🎵</div>'",
          },
        );

        const cardInfo = document.createElement('div');
        cardInfo.className = 'card-info';

        const cardTitle = document.createElement('p');
        cardTitle.className = 'card-title';
        cardTitle.textContent = song.title;

        const cardSubtitle = document.createElement('p');
        cardSubtitle.className = 'card-subtitle';
        cardSubtitle.textContent = song.subtitle || '';

        cardInfo.append(cardTitle, cardSubtitle);
        card.append(cardArt, cardInfo);
        songsGrid.appendChild(card);
      });
    }

    avatarEl.src = artist.avatar;
    avatarEl.alt = artist.name;
    heroArtistNameEl.textContent = artist.name;

    renderSongsGrid(songs);
    installSpeculationRules(songs);

    const songPreviewById = Object.fromEntries(
      songs.map(song => [song.id, { ...song, artistName: artist.name }]),
    );

    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }

    function setupActiveViewTransitionNames() {
      // Clear any existing active view-transition-names first to prevent compositor layer bloat
      const activeArt = document.querySelector('[style*="view-transition-name: active-art"]');
      if (activeArt) activeArt.style.viewTransitionName = '';
      const activeTitle = document.querySelector('[style*="view-transition-name: active-title"]');
      if (activeTitle) activeTitle.style.viewTransitionName = '';
      const activeSubtitle = document.querySelector('[style*="view-transition-name: active-subtitle"]');
      if (activeSubtitle) activeSubtitle.style.viewTransitionName = '';

      const selectedSongRaw = sessionStorage.getItem('selected-song');
      if (selectedSongRaw) {
        try {
          const song = JSON.parse(selectedSongRaw);
          const card = getSongCard(song.id);
          if (card) {
            const artEl = card.querySelector('.card-art');
            const titleEl = card.querySelector('.card-title');
            const subtitleEl = card.querySelector('.card-subtitle');
            if (artEl) artEl.style.viewTransitionName = 'active-art';
            if (titleEl) titleEl.style.viewTransitionName = 'active-title';
            if (subtitleEl) subtitleEl.style.viewTransitionName = 'active-subtitle';
          }
        } catch (e) {}
      }
    }

    function restoreSavedScroll() {
      const savedScroll = sessionStorage.getItem(scrollStorageKey);
      if (!savedScroll) {
        return;
      }

      const scrollY = Number.parseInt(savedScroll, 10);
      if (Number.isNaN(scrollY)) {
        sessionStorage.removeItem(scrollStorageKey);
        return;
      }

      // Temporarily disable smooth scroll to perform instant jump, preventing view-transition scroll lag
      const htmlStyle = document.documentElement.style;
      const originalScrollBehavior = htmlStyle.scrollBehavior;
      htmlStyle.scrollBehavior = 'auto';

      window.scrollTo(0, scrollY);

      // Simplified scroll restoration without nested RAF, avoiding layout locks on Safari
      requestAnimationFrame(() => {
        htmlStyle.scrollBehavior = originalScrollBehavior;
      });

      sessionStorage.removeItem(scrollStorageKey);
    }

    setupActiveViewTransitionNames();
    restoreSavedScroll();
    window.addEventListener('pageshow', () => {
      setupActiveViewTransitionNames();
      restoreSavedScroll();
    });

    function prefetchSongPage(songId) {
      // If Speculation Rules are supported, let browser handle prerendering natively
      if (HTMLScriptElement.supports && HTMLScriptElement.supports('speculationrules')) {
        return;
      }

      const href = getSongHref(songId);
      if (prefetchedSongs.has(href)) {
        return;
      }

      // Classic link prefetch (Chrome, Edge, Firefox)
      const link = document.createElement('link');
      link.rel = 'prefetch';
      link.as = 'document';
      link.href = href;
      document.head.appendChild(link);

      prefetchedSongs.add(href);
    }

    function rememberSelectedSong(song) {
      sessionStorage.setItem('selected-song', JSON.stringify(song));
    }

    document.querySelectorAll('.song-card').forEach(card => {
      const songId = card.dataset.songId;
      const song = songPreviewById[songId];
      if (!song) {
        return;
      }

      const warmSongPage = () => prefetchSongPage(songId);
      card.addEventListener('pointerenter', warmSongPage, { once: true });
      card.addEventListener('focus', warmSongPage, { once: true });

      // Delay prefetch slightly on touchstart to ensure it's not a fast scroll swipe, preventing scroll jank
      let touchTimeout;
      card.addEventListener('touchstart', () => {
        touchTimeout = setTimeout(warmSongPage, 80);
      }, { once: true, passive: true });
      card.addEventListener('touchmove', () => {
        clearTimeout(touchTimeout);
      }, { passive: true });

      card.addEventListener('click', event => {
        if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
          return;
        }

        // Targeted O(1) style cleanup of previous transition items to avoid full-page reflow
        const previousSongRaw = sessionStorage.getItem('selected-song');
        if (previousSongRaw) {
          try {
            const prevSong = JSON.parse(previousSongRaw);
            const prevCard = getSongCard(prevSong.id);
            if (prevCard) {
              const prevArt = prevCard.querySelector('.card-art');
              const prevTitle = prevCard.querySelector('.card-title');
              const prevSubtitle = prevCard.querySelector('.card-subtitle');
              if (prevArt) prevArt.style.viewTransitionName = '';
              if (prevTitle) prevTitle.style.viewTransitionName = '';
              if (prevSubtitle) prevSubtitle.style.viewTransitionName = '';
            }
          } catch (e) {}
        }

        const artEl = card.querySelector('.card-art');
        const titleEl = card.querySelector('.card-title');
        const subtitleEl = card.querySelector('.card-subtitle');
        if (artEl) artEl.style.viewTransitionName = 'active-art';
        if (titleEl) titleEl.style.viewTransitionName = 'active-title';
        if (subtitleEl) subtitleEl.style.viewTransitionName = 'active-subtitle';

        sessionStorage.setItem(scrollStorageKey, String(window.scrollY));
        rememberSelectedSong(song);
      });
    });
  </script>
</body>
</html>
