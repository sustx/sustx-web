<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav>
    <!-- nav-logo intentionally hidden on main page; name shown in hero -->
  </nav>

  <main>
    <section class="hero">
      <div class="artist-profile fade-up fade-up-1">
        <img class="artist-avatar" id="artist-avatar" alt="Artist" />
        <h1 class="hero-title" id="hero-artist-name"></h1>
      </div>
    </section>

    <section class="grid-section">
      <p class="grid-heading fade-up fade-up-2">Discography &nbsp;·&nbsp; All Releases</p>
      <div class="songs-grid" id="songs-grid"></div>
    </section>
  </main>

  <footer>
    <span id="footer-year"></span> 'X'Labs · All rights reserved
  </footer>

  <script src="data.js"></script>
  <script>
    document.getElementById('footer-year').textContent = new Date().getFullYear();

    // Populate artist info from data.js
    document.title = artist.name;
    document.getElementById('hero-artist-name').textContent = artist.name;
    const avatarEl = document.getElementById('artist-avatar');
    if (artist.avatar) {
      avatarEl.src = artist.avatar;
      avatarEl.alt = artist.name;
    } else {
      avatarEl.style.display = 'none';
    }

    const grid = document.getElementById('songs-grid');

    songs.forEach((song, i) => {
      const delay = 0.1 + i * 0.08;
      const artContent = song.art
        ? `<img src="${song.art}" alt="${song.title}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'placeholder-art\\'>🎵</div>'" />`
        : `<div class="placeholder-art">🎵</div>`;

      const card = document.createElement('a');
      card.href = `song.html?id=${song.id}`;
      card.className = 'song-card fade-up';
      card.style.animationDelay = `${delay}s`;
      card.style.setProperty('--glow', song.color || '#7c3aed');
      card.innerHTML = `
        <div class="card-art">
          ${artContent}
        </div>
        <div class="card-info">
          <p class="card-title">${song.title}</p>
          <p class="card-subtitle">${song.subtitle || ''}</p>
        </div>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
